version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: playto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Haseeb@16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py shell < seed.py &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://postgres:Haseeb%4016@db:5432/playto
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
      SECRET_KEY: 93947de0419399661635cf33efa1258ff66c5b5fccc8ad0e2f599bd04c31c26e
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./backend
    command: celery -A config worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgres://postgres:Haseeb%4016@db:5432/playto
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: 93947de0419399661635cf33efa1258ff66c5b5fccc8ad0e2f599bd04c31c26e
    depends_on:
      - backend

  celery_beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    environment:
      DATABASE_URL: postgres://postgres:Haseeb%4016@db:5432/playto
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: 93947de0419399661635cf33efa1258ff66c5b5fccc8ad0e2f599bd04c31c26e
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
